<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleLogin.css">
    <title>Login</title>
</head>
<body>
    <section>
        <span>Iniciar Sesion</span>
        <div class="formulario">
            <div class="campo">
                <p>Email</p>
                <input type="email" placeholder="correo electronico" class="correo-password">
            </div>

            <div class="campo">
                <p>Contraseña</p>
                <input type="password" placeholder="***********" class="correo-password">
            </div>

            <div>
                <button class="logear">Iniciar Sesion</button>
            </div>
        </div>
    </section>
</body>
</html>
