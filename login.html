<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleLogin.css">
    <title>Login</title>
</head>
<body>
    
    <a href="index.html" class="volver">← Volver</a>

    <section>

        <div>
            <img src="escudoLRC.PNG" alt="" class="escudo">
        </div>

        <span>Iniciar Sesion</span>
        <form class="formulario">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" placeholder="correo electronico" class="correo-password">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" placeholder="***********" class="correo-password">
            </div>

            <div>
                <button type="submit" class="logear">Iniciar Sesion</button>
            </div>

            <div class="recuperar-password">
                <a href="">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </section>
</body>
</html>
